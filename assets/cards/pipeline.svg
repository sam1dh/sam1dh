<text class="tx" x="44" y="46" font-size="15" font-weight="600">How my voice agents work</text>
<text class="mu" x="854" y="46" font-size="12" text-anchor="end">Pipecat · LangChain · FastAPI</text>
<g text-anchor="middle">
<rect class="pe" x="44" y="72" width="130" height="64" rx="14"/><text class="pe1" x="109" y="100" font-size="15" font-weight="600">Mic</text><text class="pe1" x="109" y="120" font-size="12">you speak</text>
<rect class="mi" x="214" y="72" width="130" height="64" rx="14"/><text class="mi1" x="279" y="100" font-size="15" font-weight="600">STT</text><text class="mi1" x="279" y="120" font-size="12">Deepgram</text>
