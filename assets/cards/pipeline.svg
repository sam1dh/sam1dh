<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<style>.gr{fill:#f6f8fa}.tx{fill:#1f2328}.mu{fill:#59636e}.rl{fill:none;stroke:#d0d7de}.pk{fill:#d85a30}.pe{fill:#ffe4dc}.pe1{fill:#7a2e1a}.mi{fill:#dff7ee}.mi1{fill:#085041}.la{fill:#ece8ff}.la1{fill:#3c3489}.ye{fill:#fff4d6}.ye1{fill:#633806}.pi{fill:#fde7f0}.pi1{fill:#72243e}
